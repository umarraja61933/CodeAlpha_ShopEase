<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ShopEase</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #111827;
            color: white;
            padding: 20px 50px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 60px auto;
        }

        .form-card {
            background-color: white;
            padding: 35px;
            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #d1d5db;
            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .btn {
            width: 100%;
            padding: 13px;

            background-color: #111827;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .btn:hover {
            background-color: #2563eb;
        }

        .error {
            background-color: #fee2e2;
            color: #b91c1c;

            padding: 12px;
            border-radius: 7px;

            margin-bottom: 20px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            margin-top: auto;

            background-color: #111827;
            color: white;

            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 20px;
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 8px;
            }
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);

            width: 32px;
            height: 32px;

            border: none;
            background: transparent;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #555;
            padding: 0;
        }

        .toggle-password:hover {
            color: #000;
        }

        .eye-icon {
            width: 21px;
            height: 21px;
        }

        .eye-closed {
            display: none;
        }
    </style>
</head>

<body>

    <header>

        <div class="logo">
            🛒 ShopEase
        </div>

        <nav>
            <a href="/">Home</a>
            <a href="/register/">Register</a>
        </nav>

    </header>


    <main class="container">

        <div class="form-card">

            <h1>Login</h1>

            {% if error %}
            <div class="error">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input type="text" id="username" name="username" required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required>

                        <button type="button" class="toggle-password" onclick="togglePassword('password', this)"
                            aria-label="Show password">

                            <svg class="eye-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>

                            <svg class="eye-icon eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M3 3l18 18" />
                                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                                <path d="M9.9 4.2A10.9 10.9 0 0 1 12 4c6.5 0 10 8 10 8a17.5 17.5 0 0 1-3.1 4.2" />
                                <path d="M6.1 6.1C3.5 8.1 2 12 2 12s3.5 8 10 8c1.4 0 2.7-.3 3.8-.8" />
                            </svg>

                        </button>
                    </div>

                </div>


                <button type="submit" class="btn">
                    Login
                </button>

            </form>


            <div class="register-link">

                Don't have an account?

                <a href="/register/">
                    Create Account
                </a>

            </div>

        </div>

    </main>


    <footer>
        <p>&copy; 2026 ShopEase. All rights reserved.</p>
    </footer>

    <script>
        function togglePassword(inputId, button) {
            const passwordInput = document.getElementById(inputId);

            const openEye = button.querySelector(".eye-open");
            const closedEye = button.querySelector(".eye-closed");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";

                openEye.style.display = "none";
                closedEye.style.display = "block";

                button.setAttribute("aria-label", "Hide password");
            } else {
                passwordInput.type = "password";

                openEye.style.display = "block";
                closedEye.style.display = "none";

                button.setAttribute("aria-label", "Show password");
            }
        }
    </script>

</body>

</html>
