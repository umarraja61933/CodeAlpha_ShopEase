<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Successful - ShopEase</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .success-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-box {
            background: white;
            width: 100%;
            max-width: 550px;
            text-align: center;
            padding: 50px 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .success-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #e8f7ee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .order-number {
            margin: 25px 0;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 8px;
            font-weight: bold;
        }

        .home-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 13px 25px;
            background: #111827;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        .home-btn:hover {
            background: #374151;
        }

        .success-box {
            max-width: 600px;
            margin: 80px auto;
            padding: 45px;
            background: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .success-box h1 {
            margin-bottom: 15px;
        }

        .success-box p {
            color: #666;
            font-size: 16px;
        }

        .home-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #111827;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        .home-btn:hover {
            background: #374151;
        }
    </style>
</head>

<body>

    <div class="success-container">

        <div class="success-box">

            <div class="success-icon">
                ✓
            </div>

            <h1>Order Placed Successfully!</h1>

            <p>
                Thank you for your order.
                Your order has been received and is now being processed.
            </p>

            <div class="order-number">
                Order Number: #{{ order.id }}
            </div>

            <a href="{% url 'home' %}" class="home-btn">
                Continue Shopping
            </a>

        </div>

    </div>

</body>

</html>
